name: CI Build and Publish

on:
  workflow_call:
    secrets:
      AZURE_DEVOPS_ARTIFACT_USERNAME:
        required: true
      AZURE_DEVOPS_ARTIFACT_TOKEN:
        required: true
      HMCTS_ADO_PAT:
        required: true
    inputs:
      is_release:
        required: false
        type: boolean
        default: false
      is_publish:
        required: true
        type: boolean
      trigger_docker:
        required: true
        type: boolean
      trigger_deploy:
        required: true
        type: boolean


jobs:
  Artefact-Version:
    runs-on: ubuntu-latest
    outputs:
      artefact_version: ${{ steps.version.outputs.artefact_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Generate Artefact Version
        id: artefact
        uses: hmcts/artefact-version-action@43882bf28ee97522e5547cc5e621b2f9e7521b44 # v1
        with:
          release: ${{ inputs.is_release }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Branch-aware version resolution. Release builds keep the action's tag-derived
      # release_version. Non-release builds no longer use the tag-derived draft_version
      # (which leaked the latest semver tag's label into every branch's image); instead:
      #   team/** push -> case-management-<projectVersion>-<branch-name-without-team/>-<short-sha>
      #   main / other -> case-management-<projectVersion>-<short-sha>
      # The short sha keeps every build's Maven version unique (publish rejects a repeat) and
      # identifies the commit an image was built from. ADO pipeline 460 appends _<timestamp>.
      - name: Resolve artefact version
        id: version
        env:
          IS_RELEASE: ${{ inputs.is_release }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.artefact.outputs.release_version }}
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          PROJECT_VERSION="$(grep -E '^projectVersion=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')"
          if [ "$IS_RELEASE" = "true" ]; then
            VERSION="$RELEASE_VERSION"
          elif [[ "$REF_NAME" == team/* ]]; then
            BRANCH="${REF_NAME#team/}"
            BRANCH="${BRANCH//\//-}"
            VERSION="case-management-${PROJECT_VERSION}-${BRANCH}-${SHORT_SHA}"
          else
            VERSION="case-management-${PROJECT_VERSION}-${SHORT_SHA}"
          fi
          echo "Resolved artefact version: $VERSION"
          echo "artefact_version=$VERSION" >> "$GITHUB_OUTPUT"

  Build:
    needs: [Artefact-Version]
    runs-on: ubuntu-latest
    outputs:
      repo_name: ${{ steps.repo_vars.outputs.repo_name }}
      artefact_name: ${{ steps.repo_vars.outputs.artefact_name }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          gradle-version: current
          gradle-home-cache-includes: |
            caches
            configuration-cache

      - name: Gradle Assemble
        env:
          ARTEFACT_VERSION: ${{ needs.Artefact-Version.outputs.artefact_version }}
        run: |
          echo "Assembling JAR with ARTEFACT_VERSION=$ARTEFACT_VERSION"
          ./gradlew assemble -DARTEFACT_VERSION=$ARTEFACT_VERSION

      - name: Extract repo name
        id: repo_vars
        run: |
          repo_name=${GITHUB_REPOSITORY##*/}
          echo "repo_name=${repo_name}" >> $GITHUB_OUTPUT
          echo "artefact_name=${repo_name}-${{ needs.Artefact-Version.outputs.artefact_version }}" >> $GITHUB_OUTPUT

      - name: Upload JAR Artefact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: app-jar
          path: build/libs/${{ steps.repo_vars.outputs.artefact_name }}.jar

  Test:
    needs: [ Artefact-Version ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          gradle-version: current
          gradle-home-cache-includes: |
            caches
            configuration-cache

      - name: Pre-pull integration images
        run: |
          docker pull postgres:16-alpine
          docker pull wiremock/wiremock:3.9.1
          docker pull mcr.microsoft.com/azure-storage/azurite:3.33.0
          docker pull eclipse-temurin:25-jre
          docker pull testcontainers/ryuk:0.12.0

      # `check` runs the unit tests and the docker-compose `integration` task, which builds the image
      # from docker/Dockerfile, waits for the app/db/wiremock stack to be healthy and tests it over
      # HTTP. pmdMain is named explicitly: build.gradle keeps PMD out of `check` unless asked for.
      - name: Gradle Check (unit + integration tests, PMD)
        env:
          ARTEFACT_VERSION: ${{ needs.Artefact-Version.outputs.artefact_version }}
        run: |
          echo "Running checks with ARTEFACT_VERSION=$ARTEFACT_VERSION"
          ./gradlew check pmdMain -DARTEFACT_VERSION=$ARTEFACT_VERSION

      # A separate invocation: jacocoTestReport reads every build/jacoco/*.exec, including the one
      # `integration` writes, and Gradle rejects that implicit dependency when both are in one run.
      # -x test reuses the execution data the step above produced instead of re-running the tests.
      - name: Coverage report
        if: always()
        env:
          ARTEFACT_VERSION: ${{ needs.Artefact-Version.outputs.artefact_version }}
        run: ./gradlew jacocoTestReport -x test -DARTEFACT_VERSION=$ARTEFACT_VERSION

      - name: Upload unit and integration test reports
        if: always()
        uses: ./.github/actions/upload-test-reports
        with:
          artifact_name: unit-integration-test-reports
          path: |
            build/reports/tests/test/
            build/test-results/test/
            build/reports/tests/integration/
            build/test-results/integration/
            build/reports/jacoco/test/

  Provider-Deploy:
    needs: [ Artefact-Version, Build, Test ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          gradle-version: current
          gradle-home-cache-includes: |
            caches
            configuration-cache

      - name: Gradle Publish
        if: ${{ inputs.is_publish }}
        env:
          ARTEFACT_VERSION: ${{ needs.Artefact-Version.outputs.artefact_version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_DEVOPS_ARTIFACT_USERNAME: ${{ secrets.AZURE_DEVOPS_ARTIFACT_USERNAME }}
          AZURE_DEVOPS_ARTIFACT_TOKEN: ${{ secrets.AZURE_DEVOPS_ARTIFACT_TOKEN }}
        run: |
          if [ -z "$AZURE_DEVOPS_ARTIFACT_USERNAME" ]; then
            echo "::warning::AZURE_DEVOPS_ARTIFACT_USERNAME is null or not set"
          fi

          if [ -z "$AZURE_DEVOPS_ARTIFACT_TOKEN" ]; then
            echo "::warning::AZURE_DEVOPS_ARTIFACT_TOKEN is null or not set"
          fi

          echo "Publishing artefact for version: $ARTEFACT_VERSION"

          ./gradlew publish \
            -DARTEFACT_VERSION=$ARTEFACT_VERSION \
            -DGITHUB_REPOSITORY=${{ github.repository }} \
            -DGITHUB_ACTOR=${{ github.actor }} \
            -DGITHUB_TOKEN=$GITHUB_TOKEN \
            -DAZURE_DEVOPS_ARTIFACT_USERNAME=$AZURE_DEVOPS_ARTIFACT_USERNAME \
            -DAZURE_DEVOPS_ARTIFACT_TOKEN=$AZURE_DEVOPS_ARTIFACT_TOKEN

  Build-Docker:
    needs: [ Provider-Deploy, Build, Artefact-Version ]
    if: ${{ inputs.trigger_docker }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download JAR Artefact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: app-jar
          path: build/libs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

      - name: Log in to GitHub Packages
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image to GitHub
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.Artefact-Version.outputs.artefact_version }}
          # Stands in for the base ADO actually deploys from,
          # crmdvrepo01.azurecr.io/hmcts/apm-services:25-jre, which is Ubuntu 24.04 and a JRE.
          # That registry is private (RFC1918), so a GitHub-hosted runner cannot pull it and this
          # job has to build on the public equivalent. Matching its OS release and its JRE-ness is
          # what makes the Trivy scan below say anything about the artefact that ships. What it
          # still cannot reproduce is the ACR image's patch level.
          # Pinned to the multi-arch index digest, not a platform-specific one.
          build-args: |
            BASE_IMAGE=eclipse-temurin:25-jre-noble@sha256:398f810215757dc1926390014272579fb0e57c41ef1c8aa4f64ae761613a168b
            JAR_FILENAME=${{ needs.Build.outputs.artefact_name }}.jar

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ needs.Artefact-Version.outputs.artefact_version }}
          format: 'table'
          # A fixable HIGH/CRITICAL finding fails the job. The base above matches the deployed one,
          # so findings are against the artefact that ships rather than an image no environment
          # runs. ignore-unfixed stays on, so an advisory with no available fix reports without
          # blocking a release nobody could unblock.
          exit-code: '1'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'

  Deploy:
    needs: [ Provider-Deploy, Build, Artefact-Version, Build-Docker ]
    if: ${{ inputs.trigger_deploy && (needs.Build-Docker.result == 'success' || needs.Build-Docker.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Extract repo name
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Trigger ADO pipeline
        uses: hmcts/trigger-ado-pipeline@5ded370558d366e7de23d69956a76e012220435d # v2
        with:
          pipeline_id: 460
          ado_pat: ${{ secrets.HMCTS_ADO_PAT }}
          template_parameters: >
            {
              "GROUP_ID": "uk.gov.hmcts.cp",
              "ARTIFACT_ID": "${{ env.REPO_NAME }}",
              "ARTIFACT_VERSION": "${{ needs.Artefact-Version.outputs.artefact_version }}",
              "TARGET_REPOSITORY": "${{ github.repository }}",
              "agentDemand": "ubuntu-j25",
              "baseImage": "hmcts/apm-services:25-jre"
            }
