services:
  db:
    image: postgres:16-alpine
    container_name: CP_CM_CP_CDK_DB_it
    environment:
      POSTGRES_DB: casemanagement
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d casemanagement"]
      interval: 5s
      timeout: 3s
      retries: 30

  wiremock:
    image: wiremock/wiremock:3.9.1
    container_name: CP_CM_wiremock
    ports:
      - "8089:8080"
    volumes:
      - ../src/integrationTest/resources/wiremock/mappings:/home/wiremock/mappings
      - ../src/integrationTest/resources/wiremock/__files:/home/wiremock/__files
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/__admin/health || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    container_name: CP_CM_app_it
    build:
      context: ..                # project root (so Docker has access to source)
      dockerfile: docker/Dockerfile
    ports:
      - "${SERVER_PORT:-8082}:${SERVER_PORT:-8082}"
      - "8787:5005"
    environment:
      CP_CM_DATASOURCE_URL: jdbc:postgresql://db:5432/casemanagement
      CP_CM_DATASOURCE_USERNAME: postgres
      CP_CM_DATASOURCE_PASSWORD: postgres
      SERVER_PORT: ${SERVER_PORT:-8082}
      CP_CM_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
      SPRING_PROFILES_ACTIVE: integration
      MANAGEMENT_HEALTH_JMS_ENABLED: "false"
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "false"
      CP_CM_AUTHZ_ENABLED: "true"
      CP_CM_HTTP_AUDIT_ENABLED: "false"
      CP_CM_AUDIT_ENABLED: "false"
      CASEMANAGEMENT_SYSTEM_USER_ID: "11111111-1111-1111-1111-111111111111"
      # WireMock service running in Docker container
      COMMON_PLATFORM_QUERY_API_BASE_URL: "http://wiremock:8080"
      CP_CM_BASE_URL: "http://wiremock:8080"
    depends_on:
      db:
        condition: service_healthy
      wiremock:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${SERVER_PORT:-8082}/casemanagement-service/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12