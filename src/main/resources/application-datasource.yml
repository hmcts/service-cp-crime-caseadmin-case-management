# Datasource, JPA and Flyway
spring:
  datasource:
    # Override these via env in each environment
    url: ${CP_CM_DATASOURCE_URL:jdbc:postgresql://localhost:55432/casemanagement}
    username: ${CP_CM_DATASOURCE_USERNAME:postgres}
    password: ${CP_CM_DATASOURCE_PASSWORD:postgres}
    driver-class-name: ${CP_CM_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
    hikari:
      pool-name: cp-hikari
      maximum-pool-size: ${CP_CM_DB_POOL_SIZE:20}
      minimum-idle: ${CP_CM_DB_MIN_IDLE:5}
      connection-timeout: 30000        # ms
      idle-timeout: 600000             # ms
      max-lifetime: 1800000            # ms
      keepalive-time: 300000           # ms
      validation-timeout: 5000         # ms
      auto-commit: false               # transactions must be committed manually — either by: Spring's @Transactional annotation, or Explicit Connection.commit() calls in your code.

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate             # schema managed by Flyway only; Hibernate validates mapping matches DB at startup
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.connection.provider_disables_autocommit: true
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true
      hibernate.order_updates: true

  sql:
    init:
      mode: never

  # Must be under spring.flyway — top-level "flyway:" is not bound by Spring Boot
  flyway:
    enabled: true
    locations:
      - classpath:db/migration/postgresql
      - classpath:db/migration
    baseline-on-migrate: true
    # Apply lower-version migrations when DB already has a higher version (e.g. V3 before V2 existed)
    out-of-order: true
