spring:
  application:
    name: service-cp-crime-caseadmin-case-management

  # Disable SpringDoc auto-configuration
  autoconfigure:
    exclude: org.springdoc.core.configuration.SpringDocKotlinConfiguration
  config:
    import:
      - "optional:classpath:application-datasource.yml"
      - "optional:classpath:application-authz.yml"
      - "optional:classpath:application-server-management.yml"
  threads:
    virtual:
      enabled: ${VIRTUAL_THREADS:false}

casemanagement:
  # System user for commands sent to Progression (CAD-1860). Case management has no system user of
  # its own yet, so this falls back to the court scheduler's until one is created by a static data
  # patch; then set CASEMANAGEMENT_SYSTEM_USER_ID and remove the fallback.
  system-user-id: ${CASEMANAGEMENT_SYSTEM_USER_ID:${COURTSCHEDULER_SYSTEM_USER_ID:}}

common-platform-query-api:
  base-url: ${CP_CM_BASE_URL:http://localhost:8080}
  ssl:
    verify: ${COMMON_PLATFORM_QUERY_API_SSL_VERIFY:false}