services:
  db:
    image: postgres:16-alpine
    container_name: CP_CM_DB_it
    environment:
      POSTGRES_DB: casemanagement
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d casemanagement" ]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - service-network

  service-cp-crime-caseadmin-case-management:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        http_proxy: ${http_proxy}
        https_proxy: ${https_proxy}
        no_proxy: ${no_proxy}
        BASE_IMAGE: ${BASE_IMAGE}
        SERVER_PORT: ${SERVER_PORT}
        JAR_FILENAME: ${JAR_FILENAME}
        JAR_FILE_PATH: ${JAR_FILE_PATH}
    environment:
      - SERVER_PORT=${SERVER_PORT:-8082}
      - CP_CM_DATASOURCE_URL=${CP_CM_DATASOURCE_URL:-jdbc:postgresql://db:5432/casemanagement}
      - CP_CM_DATASOURCE_USERNAME=${CP_CM_DATASOURCE_USERNAME:-postgres}
      - CP_CM_DATASOURCE_PASSWORD=${CP_CM_DATASOURCE_PASSWORD:-postgres}
      # Azure Service Bus intake, against the emulator below
      - CP_CM_SERVICEBUS_ENABLED=true
      - CP_CM_SERVICEBUS_CONNECTION_STRING=Endpoint=sb://servicebus-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
      - CP_CM_SERVICEBUS_QUEUE_NAME=casemanagement.requests
      # public.event subscription, against the Artemis below
      - CP_CM_PUBLICEVENTS_ENABLED=true
      - CP_CM_ARTEMIS_BROKER_URL=tcp://artemis:61616
      - CP_CM_ARTEMIS_USER=admin
      - CP_CM_ARTEMIS_PASSWORD=admin
    depends_on:
      db:
        condition: service_healthy
      servicebus-emulator:
        condition: service_started
      artemis:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8082}:${SERVER_PORT:-8082}"
    networks:
      - service-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${SERVER_PORT}/casemanagement-service/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Azure Service Bus emulator (LOCAL ONLY). The queue is declared in
  # docker/servicebus-emulator/config.json. Same images as yot-results-distribution.
  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:1.1.2
    ports:
      - "5672:5672"
      - "5300:5300"
    environment:
      ACCEPT_EULA: "Y"
      SQL_SERVER: servicebus-emulator-mssql
      MSSQL_SA_PASSWORD: "LocalOnly_Passw0rd!"
    volumes:
      - ./docker/servicebus-emulator/config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    depends_on:
      - servicebus-emulator-mssql
    networks:
      - service-network

  servicebus-emulator-mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "LocalOnly_Passw0rd!"
    networks:
      - service-network

  # The CQRS contexts' public-event broker. `public.event` is created as a multicast address (topic).
  artemis:
    image: apache/activemq-artemis:2.42.0-alpine
    ports:
      - "61616:61616"
      - "8161:8161"
    environment:
      ARTEMIS_USER: admin
      ARTEMIS_PASSWORD: admin
      ANONYMOUS_LOGIN: "false"
      EXTRA_ARGS: "--http-host 0.0.0.0 --relax-jolokia --addresses public.event"
    healthcheck:
      test: ["CMD-SHELL", "/var/lib/artemis-instance/bin/artemis check node --up --user admin --password admin || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - service-network

networks:
  service-network:
    name: service-cp-crime-caseadmin-case-management-network
